name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest, windows-11-arm]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - run: rustup update stable --no-self-update
      - run: cargo fmt --check
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo test --locked
      - if: runner.os != 'Windows'
        shell: bash
        run: |
          cargo build --locked --release
          target=$(rustc -vV | sed -n 's/^host: //p')
          tar -czf "gita-$target.tar.gz" -C target/release gita
      - if: runner.os != 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: gita-${{ runner.os }}-${{ runner.arch }}
          path: gita-*.tar.gz
      - if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $package = ./installer/build.ps1
          ./installer/test.ps1 -Package $package.FullName
          ./installer/test-migration.ps1
